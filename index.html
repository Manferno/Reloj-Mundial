<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Mundial Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- Placeholder for icons if needed -->
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header>
            <h1>Reloj Mundial <span class="highlight">Sincronizado</span></h1>
            <p>Compara y convierte horas entre zonas horarias con elegancia.</p>
        </header>

        <div class="clocks-container">
            <!-- Clock Card 1 -->
            <div class="clock-card" id="card-1">
                <div class="card-header">
                    <label for="zone-1">Zona Horaria 1</label>
                    <div class="select-wrapper">
                        <select id="zone-1"></select>
                    </div>
                </div>
                
                <div class="clock-face">
                    <div class="hand hour-hand" id="hour-hand-1"></div>
                    <div class="hand min-hand" id="min-hand-1"></div>
                    <div class="hand second-hand" id="second-hand-1"></div>
                    <div class="center-dot"></div>
                    <div class="clock-markers">
                        <!-- Markers generated by JS or CSS -->
                        <div class="marker twelve"></div>
                        <div class="marker three"></div>
                        <div class="marker six"></div>
                        <div class="marker nine"></div>
                    </div>
                </div>

                <div class="digital-display">
                    <input type="time" id="time-input-1" class="time-input">
                    <div class="date-display" id="date-1"></div>
                </div>
            </div>

            <!-- Sync Icon -->
            <div class="sync-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
            </div>

            <!-- Clock Card 2 -->
            <div class="clock-card" id="card-2">
                <div class="card-header">
                    <label for="zone-2">Zona Horaria 2</label>
                    <div class="select-wrapper">
                        <select id="zone-2"></select>
                    </div>
                </div>

                <div class="clock-face">
                    <div class="hand hour-hand" id="hour-hand-2"></div>
                    <div class="hand min-hand" id="min-hand-2"></div>
                    <div class="hand second-hand" id="second-hand-2"></div>
                    <div class="center-dot"></div>
                    <div class="clock-markers">
                        <div class="marker twelve"></div>
                        <div class="marker three"></div>
                        <div class="marker six"></div>
                        <div class="marker nine"></div>
                    </div>
                </div>

                <div class="digital-display">
                    <input type="time" id="time-input-2" class="time-input">
                    <div class="date-display" id="date-2"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="reset-now-btn" class="btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                Volver a Ahora
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
